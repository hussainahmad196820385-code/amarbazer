<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="abGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#abGradient)"/>

  <!-- Subtle Accent Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.15"/>

  <!-- Shopping Bag / Store Icon Base with Soft Shadow -->
  <g filter="url(#shadow)">
    <!-- Bag Handle -->
    <path d="M192 196 C192 144, 320 144, 320 196" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Bag Body -->
    <path d="M144 200 L368 200 L396 384 C398 398, 386 410, 372 410 L140 410 C126 410, 114 398, 116 384 Z" fill="#ffffff"/>

    <!-- Bangladeshi Green / Gold Ribbon Accent -->
    <path d="M144 200 L368 200 L362 240 L150 240 Z" fill="#047857"/>

    <!-- Center Shopping Cart / Star Badge -->
    <circle cx="256" cy="315" r="44" fill="url(#goldGradient)"/>
    <path d="M256 288 L265 306 L285 309 L270 323 L274 343 L256 333 L238 343 L242 323 L227 309 L247 306 Z" fill="#ffffff"/>
  </g>

  <!-- Notification / Active Dot -->
  <circle cx="396" cy="116" r="32" fill="#ef4444" stroke="#ffffff" stroke-width="8"/>
</svg>
